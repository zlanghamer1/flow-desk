name: Refresh Loop

# Self-perpetuating market-hours loop.
#
# Design: each firing runs fetcher/loop.py, which cycles roughly every ~7 min,
# market-guarded, publishing data.json/history.json to the `data` branch on
# every cycle (single squashed force-push commit — see the "Prepare OUT_DIR"
# step below). loop.py runs for up to ~5.5h then exits so it stays comfortably
# under GitHub's 6h hard job cap; if the session is still open at that point it
# prints a "REDISPATCH" line, and the final step here re-fires this same
# workflow via the API so the session keeps getting covered all day without a
# human touching anything.
#
# WHAT ACTUALLY STARTS THE DAY (corrected 2026-09-03): the redispatch chain
# is NOT a daily starter and never was. loop.py exits when the publish window
# closes at 15:20 CT, so on any day the loop starts after ~09:50 CT it never
# reaches MAX_RUN_SEC (5.5h), never prints REDISPATCH, and the chain simply
# does not run. Every day's first run therefore comes from a cron firing or a
# manual/API dispatch — which is why a delayed cron means a blank desk. The
# durable answer is an external pinger on the dispatch endpoint, the same fix
# ClaudeVault adopted on 2026-06-12 for the identical GitHub-cron failure;
# see DEPLOY.md and market-data/event-alerts/EXTERNAL_TRIGGER.md.
#
# Timing: loop.py's should_publish() extended window opens at 8:00am CT sharp
# — fire any earlier and the run sees "outside publish window" and exits
# immediately, doing nothing, so 8:00am CT is the earliest a firing can be
# useful at all. Every cron below sits at minute :03, off the top-of-hour mark
# GitHub's docs call out as congested/delay-prone (the Morning Brief workflow
# uses the same offset-minute trick). None of this is a hard guarantee:
# GitHub schedule triggers are documented best-effort, they fired 43 minutes
# late on 2026-08-24, 2.6-5h late on 2026-09-01/02, and not at all before
# 11:38am CT on 2026-09-03.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run one cycle now bypassing the market-hours guard (for after-hours testing)"
        type: boolean
        default: false
  schedule:
    # Backup starters only (see note above). Minute :03 on every UTC hour that
    # can land inside the publish window under either offset — 13:03 UTC is
    # 08:03 CDT / 07:03 CST, 20:03 UTC is 15:03 CDT / 14:03 CST.
    #
    # Why so many (2026-09-03): on 2026-09-03 the desk showed nothing at all.
    # Neither of the two 08:03-target crons had fired by 11:38am CT, so
    # data.json still carried the 2026-09-02 15:17 CT publish and every
    # payload-driven panel — Morning Brief tile, both flow boards, catalysts,
    # news — was a day stale. The three prior sessions each got exactly two
    # firings, both 2.6-5h late (13:03 -> 17:00 UTC, 14:03 -> 17:39 UTC on
    # 2026-09-02). Same failure ClaudeVault documented on 2026-06-12 and
    # solved with an external pinger; see market-data/event-alerts/
    # EXTERNAL_TRIGGER.md in that repo and the DEPLOY.md note here.
    #
    # A firing that lands outside 08:00-15:20 CT is free: loop.py calls
    # market_guard.should_publish() first and exits in seconds. A firing that
    # lands inside the window starts the loop for the rest of the session, and
    # the concurrency group below serializes any that arrive behind it. So the
    # extra entries only add coverage — whichever firing arrives in-window
    # first wins the day.
    - cron: "3 13 * * 1-5"    # 08:03 CDT / 07:03 CST
    - cron: "3 14 * * 1-5"    # 09:03 CDT / 08:03 CST
    - cron: "3 15 * * 1-5"    # 10:03 CDT / 09:03 CST
    - cron: "3 16 * * 1-5"    # 11:03 CDT / 10:03 CST
    - cron: "3 17 * * 1-5"    # 12:03 CDT / 11:03 CST
    - cron: "3 18 * * 1-5"    # 13:03 CDT / 12:03 CST
    - cron: "3 19 * * 1-5"    # 14:03 CDT / 13:03 CST
    - cron: "3 20 * * 1-5"    # 15:03 CDT / 14:03 CST

permissions:
  contents: write   # loop.py pushes data.json/history.json to the `data` branch
  actions: write     # needed to re-dispatch this workflow via `gh workflow run`

concurrency:
  group: refresh-loop
  cancel-in-progress: false   # never kill a running cycle mid-publish

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay well under GitHub's 360min (6h) hard cap
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "flow-desk-bot"
          git config user.email "actions@github.com"

      # No pip install — fetcher/loop.py is pure stdlib, runs on the
      # runner's default python3 (currently 3.12 on ubuntu-latest).

      - name: Prepare OUT_DIR (data branch working copy)
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/_data-branch"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REMOTE_URL" data >/dev/null 2>&1; then
            echo "data branch exists — cloning it"
            git clone --branch data --single-branch "$REMOTE_URL" "$OUT_DIR"
          else
            echo "data branch does not exist yet — creating it as an orphan branch"
            git clone "$REMOTE_URL" "$OUT_DIR"
            (
              cd "$OUT_DIR"
              git checkout --orphan data
              git rm -rf . >/dev/null 2>&1 || true
              git commit --allow-empty -m "Initialize data branch"
              git push "$REMOTE_URL" data
            )
          fi

          git -C "$OUT_DIR" config user.name "flow-desk-bot"
          git -C "$OUT_DIR" config user.email "actions@github.com"

          # Expose OUT_DIR to later steps.
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Run the refresh loop
        id: loop
        env:
          OUT_DIR: ${{ env.OUT_DIR }}
          # loop.py's guard-bypass sentinel is documented as env
          # FORCE_ONE_CYCLE=1 for exactly one cycle. workflow_dispatch's
          # `force` boolean input is mapped true -> "1", false/absent
          # (schedule firings have no `inputs` context) -> "0".
          FORCE_ONE_CYCLE: ${{ inputs.force && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_READ_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 fetcher/loop.py 2>&1 | tee loop_output.log
          if grep -q "^REDISPATCH" loop_output.log; then
            echo "redispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "redispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-dispatch if the session is likely still open
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDISPATCH: ${{ steps.loop.outputs.redispatch }}
          # Belt-and-suspenders: even if loop.py somehow emitted REDISPATCH
          # on a forced test run, never let a `force` after-hours test chain
          # into a redispatch loop.
          IS_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          if [ "$REDISPATCH" = "true" ] && [ "$IS_FORCE" != "true" ]; then
            echo "loop.py signaled REDISPATCH on a real (non-forced) run — re-dispatching refresh-loop.yml."
            gh workflow run refresh-loop.yml --repo "${{ github.repository }}"
          else
            echo "No redispatch needed (redispatch=$REDISPATCH, force=$IS_FORCE)."
          fi
