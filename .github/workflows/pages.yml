name: Deploy Pages

# Publishes the static site (index.html + vendor/) to GitHub Pages at
# https://zlanghamer1.github.io/flow-desk/. The page itself fetches
# data.json live from the `data` branch's raw content at runtime, so this
# workflow only ever ships index.html and the vendored chart library —
# nothing from fetcher/ or .github/ should end up in the deployed site.
# vendor/ added 2026-08-19 (trading-platform redesign): it carries the
# pinned TradingView Lightweight Charts build the page loads with a
# relative <script src>, so the two must always publish together.
#
# HOW IT DEPLOYS (changed 2026-07-16 during first deploy): Pages runs in
# branch mode from `gh-pages` — this job just copies index.html from main
# onto that branch, and GitHub's own "pages build and deployment" publishes
# it. The original actions/deploy-pages route was abandoned because the
# workflow token can't create a Pages site ("Resource not accessible by
# integration"), and after Pages was branch-enabled, the auto-created
# github-pages environment only accepts deployments from gh-pages, which
# rejected deploy-pages runs from main. Branch mode needs neither admin
# rights nor environment approval, so it can never wedge like that again.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - vendor/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Sync index.html + vendor to gh-pages
        run: |
          set -euo pipefail
          git config user.name "flow-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- index.html vendor
          touch .nojekyll
          git add index.html vendor .nojekyll
          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to publish."
          else
            git commit -m "Publish index.html from main (${GITHUB_SHA})"
            git push origin gh-pages
          fi
